[package]
name = "rmcp-benchmark"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
rmcp = { version = "2.2.0", features = [
  "macros",
  "schemars",
  "server",
  "transport-streamable-http-server",
] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
] }
tokio-util = "0.7"
