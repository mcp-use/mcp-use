packages:
  - packages/*
  # examples
  - packages/client/examples/browser/react
  - packages/client/examples/conformance
  - packages/server/examples/*
  - packages/server/examples/schema-libraries/*
  - packages/server/examples/views/*
  - packages/server/examples/auth/*
  - packages/create-mcp-use-app/src/templates/**/*
  # tests
  - test_app

catalog:
  "@modelcontextprotocol/sdk": ">=1.25.2"

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild

# Block installing npm releases newer than 3 days (value is minutes) to
# blunt supply-chain attacks where a malicious version is yanked within
# hours of publish. Workspace-published names are exempted.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - mcp-use
  - "@mcp-use/*"
  - create-mcp-use-app
  # v2 SDK betas are tracked closely during the v2 migration and are pinned to
  # exact versions in package.json, so bumps are always an explicit, reviewed
  # change rather than an automatic resolution.
  - "@modelcontextprotocol/*"
  - nanoid@3.3.8 || 5.0.9
  - lodash-es@4.17.23 || 4.17.24
  - brace-expansion@5.0.6
  - joi@18.2.1
  - form-data@4.0.6
  - dompurify@3.4.8 || 3.4.9 || 3.4.11
  - js-yaml@4.1.2
  - "@babel/core@7.29.1"
  - hono@4.12.34
  - brace-expansion@5.0.9

overrides:
  mcp-use: workspace:*
  "@mcp-use/client": workspace:*
  "@mcp-use/inspector": workspace:*
  create-mcp-use-app: workspace:*
  "@langchain/core": ^1.1.8
  "@langchain/anthropic": ^1.0.0
  "@langchain/openai": ^1.0.0
  langchain: ^1.2.3
  react: ^19.2.0
  react-dom: ^19.2.0
  "@types/react": ^19.2.7
  "@types/react-dom": ^19.2.3
  react-router: ^8.3.0
  react-router-dom: ^8.3.0
  qs: ">=6.16.0 <7"
  preact: ">=10.28.2"
  zod: 4.4.3
  # A2UI's renderer and schema conversion currently require the Zod 3 API.
  "mcp-use-example-a2ui>zod": 3.25.76
  "@a2ui/react>zod": 3.25.76
  "@a2ui/web_core>zod": 3.25.76
  jsondiffpatch: ">=0.7.2"
  esbuild: 0.27.1
  vite: "8.0.16"
  prismjs: ">=1.30.0"
  glob: ">=10.5.0"
  js-yaml: ">=4.3.2 <5"
  flatted: ">=3.4.2"
  tar: ">=7.5.21"
  undici: ">=7.29.1 <7.30"
  "@hono/node-server": ">=2.0.5"
  hono: ">=4.13.5 <4.13.6"
  express-rate-limit: ">=8.2.2"
  dompurify: ">=3.4.13 <3.5"
  minimatch: ">=10.2.6"
  rollup: ">=4.59.0"
  "@modelcontextprotocol/sdk": ">=1.25.2"
  ai: ">=5.0.52"
  axios: ">=1.18.0"
  body-parser: ">=2.3.0"
  brace-expansion: ">=2.0.3"
  "@isaacs/brace-expansion": ">=5.0.9"
  picomatch: ">=4.0.4"
  form-data: ">=4.0.6"
  lodash: ">=4.18.0"
  lodash-es: ">=4.17.24"
  joi: ">=18.2.6 <19"
  "@babel/core": ">=7.29.1"
  # Start's compiler imports Babel 7's default export; Babel 8 removed it.
  "@tanstack/start-plugin-core>@babel/core": "^7.29.1"
  "@tanstack/router-plugin>@babel/core": "^7.29.1"
  path-to-regexp: ">=8.4.0"
  yaml: ">=2.8.3"
  "@eslint/plugin-kit": ">=0.3.4"
  protobufjs: ">=7.5.6 <8"
  "@protobufjs/utf8": ">=1.1.1"
  vitest: 4.1.11
  ws: ">=8.20.1"
  uuid: ">=13.0.1 <14"
  fast-uri: ">=4.1.4 <4.2"
  ip-address: ">=10.7.1 <11"
  postcss: ">=8.5.23"
  sharp: ">=0.35.4 <0.35.5"
  langsmith: ">=0.6.0"
  follow-redirects: ">=1.16.0"
  better-auth: ">=1.6.2"
  "@ungap/structured-clone": ">=1.3.3"
  browserslist: ">=4.28.7 <4.29"
  smol-toml: ">=1.7.1 <1.8"
  mermaid: ">=11.16.1 <11.17"
  markdown-it: ">=14.3.1 <14.4"
  baseline-browser-mapping: ">=2.11.0 <2.12"
  "@humanfs/node": ">=0.16.8 <0.17"
  "@ai-sdk/provider-utils": 4.0.33
  brace-expansion@>=5.0.0 <5.0.12: 5.0.12
  nanoid@<3.3.18: 3.3.18
  nanoid@>=4.0.0 <5.0.9: ^5.0.9

allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  # protobufjs only checks dependency version conventions during postinstall.
  protobufjs: false
  # The Next.js route example does not use image optimization, so its optional
  # sharp dependency must not run a native build in CI.
  sharp: false
  unrs-resolver: true

patchedDependencies:
  "@modelcontextprotocol/server@2.0.0": patches/@modelcontextprotocol__server@2.0.0.patch
