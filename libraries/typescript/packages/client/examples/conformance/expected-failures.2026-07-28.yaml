# The 2026 protocol leg uses a separate baseline because a scenario can pass
# on the legacy wire but fail under the modern per-request envelope.
# Stale entries fail the runner and must be removed as support lands.
#
# Baseline target: @modelcontextprotocol/conformance 0.2.0-alpha.10.
client: []
server:
