name: Create App E2E (Canary)

on:
  workflow_dispatch:
  workflow_run:
    workflows: [TypeScript Release]
    types: [completed]
    branches: [canary]

permissions:
  actions: read
  contents: read

concurrency:
  group: create-app-canary
  cancel-in-progress: true

jobs:
  versions:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.versions.outputs.run }}
      scaffolder: ${{ steps.versions.outputs.scaffolder }}
      sdk: ${{ steps.versions.outputs.sdk }}
    steps:
      - name: Find verified release marker
        id: marker
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.payload.workflow_run.id,
            });
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (run.repository?.full_name !== repository || run.head_repository?.full_name !== repository ||
                run.head_branch !== 'canary' || !['push', 'workflow_dispatch'].includes(run.event) ||
                run.conclusion !== 'success' || run.path !== '.github/workflows/typescript-release.yml') {
              throw new Error('Refusing a marker from an untrusted release run');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.payload.workflow_run.id,
            });
            core.setOutput('exists', artifacts.some(a => a.name === 'railway-deploy-marker' && !a.expired));
      - uses: actions/download-artifact@v8
        if: github.event_name == 'workflow_run' && steps.marker.outputs.exists == 'true'
        with:
          name: railway-deploy-marker
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/release-marker
      - name: Select exact npm versions
        id: versions
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            scaffolder=$(npm view --prefer-online create-mcp-use-app@latest version)
            sdk=$(npm view --prefer-online mcp-use@canary version)
          elif [ "$EVENT" = workflow_run ] && [ -f "$RUNNER_TEMP/release-marker/railway-deploy-marker.txt" ]; then
            marker="$RUNNER_TEMP/release-marker/railway-deploy-marker.txt"
            # Treat the marker as data, never as shell code or workspace files.
            [[ "$(sed -n 's/^packages_published=//p' "$marker")" = true ]] || exit 1
            [[ "$(sed -n 's/^branch=//p' "$marker")" = canary ]] || exit 1
            [[ "$(sed -n 's/^sha=//p' "$marker")" =~ ^[a-f0-9]{40}$ ]] || exit 1
            scaffolder=$(sed -n 's/^scaffolder=//p' "$marker")
            sdk=$(sed -n 's/^sdk=//p' "$marker")
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$scaffolder" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-canary\.[0-9]+)?$ ]] || exit 1
          [[ "$sdk" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-canary\.[0-9]+)?$ ]] || exit 1
          printf 'run=true\nscaffolder=%s\nsdk=%s\n' "$scaffolder" "$sdk" >> "$GITHUB_OUTPUT"

  smoke:
    needs: versions
    if: needs.versions.outputs.run == 'true'
    name: Scaffold / ${{ matrix.pm }} / ${{ matrix.template }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, yarn]
        template: [starter, mcp-apps, blank]
    env:
      SCAFFOLDER: ${{ needs.versions.outputs.scaffolder }}
      SDK: ${{ needs.versions.outputs.sdk }}
      MCP_USE_ANONYMIZED_TELEMETRY: "false"
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - if: matrix.pm == 'yarn'
        run: corepack enable
      - name: Generate app with the verified versions
        run: |
          if [ '${{ matrix.pm }}' = npm ]; then
            npx --yes "create-mcp-use-app@$SCAFFOLDER" test-app --template '${{ matrix.template }}' --sdk-version "$SDK"
          else
            yarn dlx "create-mcp-use-app@$SCAFFOLDER" test-app --template '${{ matrix.template }}' --sdk-version "$SDK"
          fi
      - name: Install and build generated app
        working-directory: test-app
        run: |
          ${{ matrix.pm }} install
          ${{ matrix.pm }} run build
      - name: Observe dev server readiness
        working-directory: test-app
        run: |
          ${{ matrix.pm }} run dev > dev.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --output /dev/null --fail http://127.0.0.1:3000/mcp; then exit 0; fi
            sleep 1
          done
          cat dev.log
          echo '::error::Generated app did not become ready'
          exit 1
