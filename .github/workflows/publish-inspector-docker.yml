name: Publish Inspector Docker image

on:
  workflow_run:
    workflows: [TypeScript Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-inspector-docker
  cancel-in-progress: false

jobs:
  publish:
    name: Publish stable Inspector image
    # Manual runs republish npm's current stable Inspector version. Automatic
    # runs start only after a successful TypeScript release on main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 30
    steps:
      - name: Find verified release marker
        id: marker
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.payload.workflow_run.id,
            });
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (run.repository?.full_name !== repository || run.head_repository?.full_name !== repository ||
                run.head_branch !== 'main' || !['push', 'workflow_dispatch'].includes(run.event) ||
                run.conclusion !== 'success' || run.path !== '.github/workflows/typescript-release.yml') {
              throw new Error('Refusing a marker from an untrusted release run');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.payload.workflow_run.id,
            });
            core.setOutput('exists', artifacts.some(a => a.name === 'railway-deploy-marker' && !a.expired));
      - uses: actions/download-artifact@v8
        if: github.event_name == 'workflow_run' && steps.marker.outputs.exists == 'true'
        with:
          name: railway-deploy-marker
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/release-marker
      - name: Read verified source revision
        id: source
        if: github.event_name == 'workflow_run' && steps.marker.outputs.exists == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const marker = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'release-marker/railway-deploy-marker.txt'), 'utf8');
            const field = name => {
              const values = marker.split('\n').filter(line => line.startsWith(`${name}=`));
              if (values.length !== 1) throw new Error(`Missing or duplicate marker field: ${name}`);
              return values[0].slice(name.length + 1);
            };
            const sha = field('sha');
            if (field('packages_published') !== 'true' || field('branch') !== 'main' || !/^[a-f0-9]{40}$/.test(sha)) {
              throw new Error('Invalid stable release marker');
            }
            // A syntactically valid SHA must also belong to the trusted branch.
            // The publisher can have advanced beyond workflow_run.head_sha
            // after acquiring its lock, so equality with that SHA is not valid.
            const { data: comparison } = await github.rest.repos.compareCommits({
              ...context.repo, base: sha, head: 'main',
            });
            if (!['ahead', 'identical'].includes(comparison.status)) {
              throw new Error('Release source is not part of main');
            }
            core.setOutput('sha', sha);
      - name: Checkout source
        if: github.event_name == 'workflow_dispatch' || steps.marker.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Determine stable Inspector version
        if: github.event_name == 'workflow_dispatch' || steps.marker.outputs.exists == 'true'
        id: version
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # A manual recovery must resolve the registry's current latest
            # dist-tag, not a cached npm metadata response.
            npm cache clean --force
            VERSION=$(npm view --prefer-online '@mcp-use/inspector@latest' version)
          else
            git fetch --tags --force
            INSPECTOR_TAG=$(git tag --points-at HEAD | grep -E '^@mcp-use/inspector@[0-9]+\.[0-9]+\.[0-9]+$' || true)
            if [ -z "$INSPECTOR_TAG" ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "No stable @mcp-use/inspector release in this workflow run."
              exit 0
            fi

            if [ "$(printf '%s\n' "$INSPECTOR_TAG" | wc -l | tr -d ' ')" != "1" ]; then
              echo "Expected exactly one stable Inspector tag, found: $INSPECTOR_TAG" >&2
              exit 1
            fi

            VERSION="${INSPECTOR_TAG#@mcp-use/inspector@}"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable x.y.z Inspector version, received: $VERSION" >&2
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.version.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish stable Inspector Docker image
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: libraries/typescript/packages/inspector
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            mcpuse/inspector:${{ steps.version.outputs.version }}
            mcpuse/inspector:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
