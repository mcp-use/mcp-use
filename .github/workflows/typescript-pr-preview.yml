name: TypeScript PR Preview

on:
  pull_request:
    branches:
      - main
      - canary
      - v2
    paths:
      - "libraries/typescript/**"
      - ".github/workflows/typescript-pr-preview.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Publish PR Preview
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.pr-number.outputs.pr-number }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.6.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: libraries/typescript/pnpm-lock.yaml

      - name: Install Dependencies
        working-directory: libraries/typescript
        run: pnpm install --no-frozen-lockfile

      - name: Build Packages
        working-directory: libraries/typescript
        run: pnpm build

      - name: Publish Preview Packages
        env:
          PNPM_CONFIG_NODE_LINKER: hoisted
        run: pnpm dlx pkg-pr-new publish './libraries/typescript/packages/*' --pnpm

      - name: Get PR Number
        id: pr-number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "pr-number=$PR_NUMBER" >> $GITHUB_OUTPUT

  deno-test:
    name: Test with Deno (PR Preview)
    runs-on: ubuntu-latest
    needs: preview
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Create temporary deno.json with PR preview imports
        working-directory: libraries/typescript/packages/server/tests/deno
        env:
          PR_NUMBER: ${{ needs.preview.outputs.pr-number }}
        # Note: Hybrid mapping to satisfy conflicting Zod requirements:
        # - SDK imports "zod/v3" and needs "z.custom" (available in Zod v3)
        # - Other deps import "zod/v4" and "zod/v4-mini"
        # - We map "zod/v3" to "zod@3.24.4" (aliasing v3 import to root v3 package)
        # - We use esm.sh for zod to match the PR preview environment
        run: |
          cat > deno.json << EOF
          {
            "imports": {
              "mcp-use": "https://esm.sh/pr/mcp-use/mcp-use@$PR_NUMBER?no-dts&external=zod",
              "zod": "https://esm.sh/zod@3.24.4",
              "zod/v3": "https://esm.sh/zod@3.24.4",
              "zod/v4": "https://esm.sh/zod@4.2.0",
              "zod/v4-mini": "https://esm.sh/zod@4.2.0",
              "zod/v4/mini": "https://esm.sh/zod@4.2.0",
              "zod/v4/core": "https://esm.sh/zod@4.2.0"
            }
          }
          EOF
          echo "Generated deno.json with PR #$PR_NUMBER preview packages:"
          cat deno.json

      - name: Wait for esm.sh to build and warm the preview packages
        id: warm-preview
        env:
          PR_NUMBER: ${{ needs.preview.outputs.pr-number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Waiting for esm.sh to build the preview package..."
          SHORT_SHA="${COMMIT_SHA:0:7}"

          MAX_RETRIES=10
          RETRY_DELAY=30

          # Probe the exact URL deno.json imports. esm.sh keys its build cache
          # on the query arguments, so the bare package URL is a different
          # build: a warm bare URL says nothing about the artifact the tests
          # import, and the imported variant can still be cold.
          PR_URL="https://esm.sh/pr/mcp-use/mcp-use@${PR_NUMBER}?no-dts&external=zod"
          COMMIT_URL="https://esm.sh/pr/mcp-use/mcp-use@${SHORT_SHA}"

          echo "Checking URLs:"
          echo "  imported by deno.json (gates the tests): $PR_URL"
          echo "  imported by nothing (informational):      $COMMIT_URL"

          # The check used to be a HEAD against the bare preview URL. A HEAD
          # only proves metadata, not that the artifact is fetchable; and the
          # bare URL is a different build from the one deno.json imports,
          # because esm.sh keys its build cache on the query arguments. A
          # ranged GET against the exact import-map URL forces resolution: it
          # proves the artifact is fetchable and warms the build that
          # `deno cache` and `deno test` hit immediately afterwards. The probe
          # timeout is long enough for one cold build, so a slow build counts
          # as "not yet" rather than as a failure.
          is_warm() {
            local url="$1"
            local timeout="${2:-30}"
            local code
            code="$(curl -s -o /dev/null -w '%{http_code}' -r 0-0 --max-time "$timeout" "$url")" || return 1
            [ "$code" = "200" ] || [ "$code" = "206" ]
          }

          READY=false
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            if is_warm "$PR_URL"; then
              READY=true
              echo "OK the imported preview package is built and warm on esm.sh"
              break
            fi

            if [ "$attempt" -lt "$MAX_RETRIES" ]; then
              echo "Waiting for the build... (attempt $attempt/$MAX_RETRIES)"
              sleep "$RETRY_DELAY"
            fi
          done

          # esm.sh resolves PR numbers to commit SHAs, so this is the same
          # build as the import-map URL above. No import map references it,
          # so one quick probe is diagnostic only.
          if is_warm "$COMMIT_URL" 10; then
            echo "INFO commit URL is available (not imported by the tests)"
          else
            echo "INFO commit URL unavailable (not imported by the tests)"
          fi

          if [ "$READY" != true ]; then
            echo "WARN esm.sh never served the preview package after ${MAX_RETRIES} attempts."
            echo "WARN skipping the Deno tests: this is CDN unavailability, not a test failure."
          fi

          # The cache and test steps read this from the job environment and
          # skip instead of running commands that cannot succeed, so an
          # unavailable preview package stays neutral rather than failing the PR.
          echo "ready=$READY" >> "$GITHUB_ENV"

      - name: Cache Deno Dependencies
        if: env.ready == 'true'
        working-directory: libraries/typescript/packages/server/tests/deno
        env:
          DENO_DOWNLOAD_TIMEOUT: "300000"  # 5 minutes in milliseconds
        run: |
          echo "Pre-caching Deno dependencies to avoid download timeouts during tests..."
          MAX_CACHE_RETRIES=3
          RETRY_DELAY=30
          
          for i in $(seq 1 $MAX_CACHE_RETRIES); do
            echo "Cache attempt $i/$MAX_CACHE_RETRIES..."
            if deno cache --reload basic-server.test.ts; then
              echo "✅ Dependencies cached successfully"
              break
            fi
            
            if [ $i -lt $MAX_CACHE_RETRIES ]; then
              echo "⚠️ Cache attempt $i failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            else
              echo "⚠️ Failed to cache after $MAX_CACHE_RETRIES attempts"
              echo "Proceeding with tests anyway - they may download dependencies on demand..."
            fi
          done

      - name: Run Deno Tests
        if: env.ready == 'true'
        working-directory: libraries/typescript/packages/server/tests/deno
        env:
          MCP_USE_ANONYMIZED_TELEMETRY: false
          DENO_DOWNLOAD_TIMEOUT: "300000"  # 5 minutes in milliseconds
          PR_NUMBER: ${{ needs.preview.outputs.pr-number }}
        run: |
          echo "Running Deno tests against PR #$PR_NUMBER preview packages..."
          MAX_TEST_ATTEMPTS=3
          RETRY_DELAY=30

          # esm.sh cold builds are the known flake source here, so a single
          # failed attempt is retried before the job reports a real failure.
          for attempt in $(seq 1 "$MAX_TEST_ATTEMPTS"); do
            echo "Deno test attempt $attempt/$MAX_TEST_ATTEMPTS..."
            if deno test --no-check --allow-read --allow-env --allow-net; then
              echo "✅ Deno tests passed"
              exit 0
            fi

            if [ "$attempt" -lt "$MAX_TEST_ATTEMPTS" ]; then
              echo "⚠️ Attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep "$RETRY_DELAY"
            fi
          done

          echo "❌ Deno tests failed after $MAX_TEST_ATTEMPTS attempts"
          exit 1
