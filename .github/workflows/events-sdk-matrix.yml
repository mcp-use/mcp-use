name: Events SDK matrix
permissions:
  contents: read

# One full workspace build per SDK leg (PLAN.md D83, §18.7.2). The SDK is
# compiled into mcp-use, the CLI and the Inspector, so a leg is a separate
# build through scripts/sdk-matrix/apply.mjs, never an install override.
#
# Gating (D83):
#   pinned, candidate          fail the PR on anything
#   latest                     never fails a PR; a red run (nightly/dispatch)
#                              opens or updates an `sdk-compat-blocker` issue
#   prerelease, main, pr-3209  never block; a red run escalates to an issue

on:
  pull_request:
    branches: [main, canary, feat/mcp-events]
    paths:
      - "libraries/typescript/packages/server/src/**"
      - "libraries/typescript/packages/client/src/**"
      - "libraries/typescript/packages/events-core/**"
      - "libraries/typescript/packages/inspector/**"
      - "libraries/typescript/packages/cli/src/toolchain/**"
      - "libraries/typescript/pnpm-workspace.yaml"
      - "libraries/typescript/patches/sdk/**"
      - "libraries/typescript/scripts/sdk-matrix/**"
      - ".github/workflows/events-sdk-matrix.yml"
  workflow_dispatch:
    inputs:
      sdk:
        description: "SDK leg"
        required: true
        type: choice
        options: [pinned, latest, prerelease, main, pr-3209, candidate]
      candidate:
        description: "SDK_CANDIDATE for the candidate leg (exact version, or tarball URL containing {pkg})"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      sdk:
        description: "SDK leg"
        required: true
        type: string
      candidate:
        required: false
        type: string
        default: ""
      ref:
        required: false
        type: string
        default: ""

concurrency:
  group: events-sdk-matrix-${{ github.event.pull_request.number || github.ref }}-${{ inputs.sdk || 'pr' }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan legs
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      - id: legs
        env:
          EVENT: ${{ github.event_name }}
          SDK: ${{ inputs.sdk }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # An sdk-bump PR (Renovate group branch or sdk-bump/*) also runs the
            # candidate leg; its catalog already holds the candidate version.
            case "$HEAD_REF" in
              renovate/mcp-sdk*|sdk-bump/*)
                echo 'legs=[{"leg":"pinned","blocking":true},{"leg":"latest","blocking":false},{"leg":"candidate","blocking":true}]' >> "$GITHUB_OUTPUT" ;;
              *)
                echo 'legs=[{"leg":"pinned","blocking":true},{"leg":"latest","blocking":false}]' >> "$GITHUB_OUTPUT" ;;
            esac
          else
            case "$SDK" in
              pinned|candidate) b=true ;;
              latest|prerelease|main|pr-3209) b=false ;;
              *) echo "::error::unknown leg '$SDK'"; exit 1 ;;
            esac
            echo "legs=[{\"leg\":\"$SDK\",\"blocking\":$b}]" >> "$GITHUB_OUTPUT"
          fi

  leg:
    needs: plan
    name: sdk-${{ matrix.leg }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.legs) }}
    continue-on-error: ${{ !matrix.blocking && github.event_name == 'pull_request' }}
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      CI: "true"
      # A CI checkout is a scratch clone, which apply.mjs requires.
      MCP_USE_SDK_MATRIX_SCRATCH: "1"
      MCP_USE_TEST_REDIS_URL: redis://localhost:6379
      MCP_USE_SDK_LEG: ${{ matrix.leg }}
      SDK_CANDIDATE: ${{ inputs.candidate }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: libraries/typescript
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1

      - name: Skip check (prerelease leg)
        id: skip
        run: |
          if [ "$MCP_USE_SDK_LEG" = "prerelease" ] && ! node scripts/sdk-matrix/native-events-detector.mjs --prerelease-available; then
            echo "skip=no-newer-prerelease" >> "$GITHUB_OUTPUT"
            echo "::notice::prerelease leg skipped: no-newer-prerelease"
          fi

      - name: Candidate version from the sdk-bump PR catalog
        if: matrix.leg == 'candidate' && env.SDK_CANDIDATE == ''
        run: |
          v=$(node -e 'const y=require("fs").readFileSync("pnpm-workspace.yaml","utf8");const m=/"?@modelcontextprotocol\/server"?:\s*"?([^"\s]+)/.exec(y.split("catalogs:")[1]??"");if(!m)process.exit(1);console.log(m[1])')
          echo "SDK_CANDIDATE=$v" >> "$GITHUB_ENV"

      # A build or typecheck failure on a leg is a product failure (§18.7.2).
      - name: Apply leg, install and build
        if: steps.skip.outputs.skip == ''
        run: node scripts/sdk-matrix/apply.mjs "$MCP_USE_SDK_LEG" --scratch

      - name: Unit and contract tests (source)
        if: steps.skip.outputs.skip == ''
        run: pnpm --filter mcp-use --filter @mcp-use/client --if-present run test:run

      - name: SDK contract tests (built entries)
        if: steps.skip.outputs.skip == ''
        working-directory: libraries/typescript/packages/server
        run: |
          if [ -d tests/sdk-contract ]; then
            MCP_USE_TEST_BUILT=1 pnpm exec vitest run tests/sdk-contract
          else
            # TODO(events): remove once WP-23/WP-28 land tests/sdk-contract.
            echo "::warning::tests/sdk-contract not present yet"
          fi

      - name: Events conformance (both dialects, per-leg expected failures)
        if: steps.skip.outputs.skip == ''
        working-directory: libraries/typescript/packages/server
        run: |
          if [ -d tests/events/official ]; then
            pnpm exec vitest run tests/events/official
          else
            # TODO(events): remove once WP-05/WP-38 suites land.
            echo "::warning::Events conformance suites not present yet"
          fi

      - name: Interop with #3209 (legs whose SDK exports ./ext/events)
        if: steps.skip.outputs.skip == ''
        working-directory: libraries/typescript/packages/server
        run: |
          if node ../../scripts/sdk-matrix/native-events-detector.mjs --installed .; then
            pnpm exec vitest run tests/sdk-contract/interop
          else
            echo "SDK on this leg has no ./ext/events; interop suite not applicable"
          fi

      - name: Upload sdk-variant.json
        if: always() && steps.skip.outputs.skip == ''
        uses: actions/upload-artifact@v4
        with:
          name: sdk-variant-${{ matrix.leg }}
          path: libraries/typescript/sdk-variant.json
          if-no-files-found: warn

      - name: Pack the leg build for continuity
        if: steps.skip.outputs.skip == ''
        run: |
          mkdir -p "$RUNNER_TEMP/leg-packs"
          pnpm --filter mcp-use --filter @mcp-use/client --filter @mcp-use/cli pack --pack-destination "$RUNNER_TEMP/leg-packs"

      - uses: actions/upload-artifact@v4
        if: steps.skip.outputs.skip == ''
        with:
          name: sdk-packs-${{ matrix.leg }}
          path: ${{ runner.temp }}/leg-packs/*.tgz
          retention-days: 3

  # §18.7.3: subscriptions survive A -> B -> A on one Redis, both directions.
  continuity:
    needs: [plan, leg]
    if: always() && needs.plan.result == 'success'
    name: continuity (pinned <-> ${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.legs) }}
    continue-on-error: ${{ !matrix.blocking && github.event_name == 'pull_request' }}
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      CI: "true"
      MCP_USE_TEST_REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: libraries/typescript
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: libraries/typescript/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
      # The pinned packs come from this run when it built pinned; otherwise
      # continuity.mjs builds pinned itself (nightly single-leg runs).
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sdk-packs-pinned
          path: ${{ runner.temp }}/packs/pinned
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sdk-packs-${{ matrix.leg }}
          path: ${{ runner.temp }}/packs/${{ matrix.leg }}
      - name: Continuity pinned -> leg -> pinned, then leg -> pinned -> leg
        run: node scripts/sdk-matrix/continuity.mjs --a "$RUNNER_TEMP/packs/pinned" --b "$RUNNER_TEMP/packs/${{ matrix.leg }}" --leg "${{ matrix.leg }}"

  # A red non-PR run opens or updates an `sdk-compat-blocker` issue (D83).
  # PR runs never write issues, so fork PRs need no write token.
  report:
    needs: [plan, leg, continuity]
    if: always() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update sdk-compat-blocker issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LEG: ${{ inputs.sdk }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="sdk-compat-blocker: SDK leg ${LEG} is red"
          body="Leg \`${LEG}\` failed: ${RUN_URL}. This SDK version cannot be adopted until this issue is closed (PLAN.md D83)."
          n=$(gh issue list --label sdk-compat-blocker --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$title" --label sdk-compat-blocker --body "$body"
          fi
