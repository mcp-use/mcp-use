name: TypeScript Release

# Keep this filename: npm trusted publishing is configured against it.
on:
  push:
    branches: [main, canary]
    paths:
      - "libraries/typescript/**"
      - "docs/typescript/changelog/changelog.mdx"
      - "docs/inspector/changelog.mdx"
      - ".github/workflows/typescript-release.yml"
      - ".github/actions/setup-typescript/**"
      - ".github/scripts/**"
  workflow_dispatch:
    inputs:
      repair_metadata:
        description: Re-verify current versions and repair tags, GitHub releases, and deployment markers
        type: boolean
        default: false

permissions:
  contents: read

# Both channels mutate the same npm packages. Never interrupt a publisher.
concurrency:
  group: typescript-release
  cancel-in-progress: false
  queue: max

env:
  HUSKY: "0"
  MCP_USE_ANONYMIZED_TELEMETRY: "false"

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canary'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: libraries/typescript
    steps:
      - uses: actions/checkout@v7
        with:
          # Resolve the branch once, after acquiring the release lock. It can
          # include a version commit made by an earlier queued run.
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-typescript
      - name: Set up npm trusted publishing
        run: npm install -g npm@12.0.2
      - name: Test release tooling
        run: pnpm test:release-channel
      - name: Prepare versions or recover an interrupted release
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVER_TAGS: ${{ inputs.repair_metadata && 'all' || 'true' }}
        run: bash ../../.github/scripts/prepare-typescript-release.sh
      - name: Require changelog docs for stable publication
        if: steps.prepare.outputs.publish == 'true' && github.ref_name == 'main'
        run: pnpm check:release-docs --plan "$RUNNER_TEMP/release-plan.json"
      - name: Build final package versions
        if: steps.prepare.outputs.publish == 'true'
        run: |
          node scripts/release-packages.mjs assert-source "$RUNNER_TEMP/release-plan.json"
          pnpm build
      - name: Test final package versions
        if: steps.prepare.outputs.publish == 'true'
        run: pnpm test:ci
      - name: Pack and validate all package entry points
        if: steps.prepare.outputs.publish == 'true'
        run: node scripts/release-packages.mjs pack "$RUNNER_TEMP/release-plan.json" "$RUNNER_TEMP/release-artifacts"
      - name: Verify the packed installation
        if: steps.prepare.outputs.publish == 'true'
        env:
          MCP_USE_PACKED_ARTIFACT_DIR: ${{ runner.temp }}/release-artifacts
        run: pnpm verify:release-install
      - name: Publish verified tarballs
        if: steps.prepare.outputs.publish == 'true'
        id: publish
        # npm may accept a package but lose the response. Registry verification
        # below decides whether the complete release actually succeeded.
        continue-on-error: true
        run: node scripts/release-packages.mjs publish "$RUNNER_TEMP/release-plan.json"
      - name: Verify npm artifacts and dist-tags
        if: steps.prepare.outputs.publish == 'true'
        run: pnpm release-channel verify --plan "$RUNNER_TEMP/release-plan.json"
      - name: Create tags and GitHub releases for verified versions
        if: steps.prepare.outputs.publish == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await require('./.github/scripts/typescript-release-notes.cjs')({ github, context, core });
      - name: Write verified deployment marker
        if: steps.prepare.outputs.publish == 'true'
        run: |
          printf 'packages_published=true\nbranch=%s\nsha=%s\n' "$GITHUB_REF_NAME" "$(git rev-parse HEAD)" > "$RUNNER_TEMP/railway-deploy-marker.txt"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const plan = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release-plan.json`, 'utf8'));
          const version = name => plan.releases.find(r => r.name === name).version;
          fs.appendFileSync(`${process.env.RUNNER_TEMP}/railway-deploy-marker.txt`, `scaffolder=${version('create-mcp-use-app')}\nsdk=${version('mcp-use')}\n`);
          JS
      - name: Upload deployment marker
        if: steps.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: railway-deploy-marker
          path: ${{ runner.temp }}/railway-deploy-marker.txt
          retention-days: 7
      - name: Notify stable release
        if: steps.prepare.outputs.publish == 'true' && github.ref_name == 'main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_CHANNEL_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then exit 0; fi
          tag=$(node -e 'const p=require(process.env.RUNNER_TEMP + "/release-plan.json"); const r=p.releases.find(r=>r.target && r.name==="mcp-use"); console.log(r ? `${r.name}@${r.version}` : "")')
          if [ -z "$tag" ]; then exit 0; fi
          notes=$(gh release view "$tag" --json body --jq .body)
          payload=$(jq -n --arg title "TypeScript ${tag#mcp-use@}" --arg url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" --arg notes "$notes" '{embeds:[{title:$title,url:$url,description:($notes[:1800]),color:5814783}]}')
          curl --fail-with-body --silent --show-error -H 'Content-Type: application/json' --data "$payload" "$WEBHOOK_URL"
      - name: Save release plan and tarballs for diagnosis
        if: always() && steps.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: typescript-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-plan.json
            ${{ runner.temp }}/release-artifacts/*.tgz
          retention-days: 14
