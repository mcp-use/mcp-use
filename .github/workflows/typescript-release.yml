name: TypeScript Release

on:
  push:
    branches:
      - main
      - canary
      - beta
    paths:
      - "libraries/typescript/**"
      - ".github/workflows/typescript-release.yml"
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force publish packages'
        required: false
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    if: github.ref != 'refs/heads/beta'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.6.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: "pnpm"
          cache-dependency-path: libraries/typescript/pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install Dependencies
        working-directory: libraries/typescript
        run: pnpm install --no-frozen-lockfile

      - name: Build Packages
        working-directory: libraries/typescript
        run: pnpm build

      # ============================================================================
      # CANARY BRANCH: Prerelease workflow
      # ============================================================================

      - name: Enter Prerelease Mode (Canary)
        if: github.ref == 'refs/heads/canary'
        run: |
          cd libraries/typescript
          if [ ! -f .changeset/pre.json ]; then
            echo "Entering canary prerelease mode..."
            pnpm changeset pre enter canary
            cd ../..
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add libraries/typescript/.changeset/pre.json
            git commit -m "chore: enter canary prerelease mode" || echo "No changes to commit"
            git push
          else
            echo "Already in prerelease mode"
          fi

      - name: Check for changesets (Canary)
        if: github.ref == 'refs/heads/canary'
        working-directory: libraries/typescript
        id: has-changesets
        run: |
          if [ -n "$(find .changeset -name '*.md' -not -name 'README.md' -print -quit)" ]; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
            echo "Found changesets to publish"
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
            echo "No changesets found"
          fi

      - name: Version packages (Canary)
        if: github.ref == 'refs/heads/canary' && steps.has-changesets.outputs.has_changesets == 'true'
        run: |
          cd libraries/typescript
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm changeset version
          cd ../..
          git add .
          git commit -m "chore(typescript): version packages (canary)" || echo "No changes to commit"
          git push

      - name: Publish packages (Canary)
        if: github.ref == 'refs/heads/canary' && steps.has-changesets.outputs.has_changesets == 'true'
        working-directory: libraries/typescript
        run: |
          # Using npm trusted publishing (OIDC) - no token needed
          pnpm changeset publish
          echo "✅ Published canary packages to npm using trusted publishing"

      - name: Tag + push tags (Canary)
        if: github.ref == 'refs/heads/canary' && steps.has-changesets.outputs.has_changesets == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          
          # Ensure we're on the latest commit (commits were pushed in previous step)
          git fetch --tags --force
          git pull origin canary
          
          cd libraries/typescript
          pnpm changeset tag
          cd ../..

          NEW_TAGS=$(git tag --points-at HEAD)
          if [ -z "$NEW_TAGS" ]; then
            echo "ℹ️  No tags were created by changeset tag"
            exit 0
          fi

          echo "📦 Tags created: $NEW_TAGS"
          echo "$NEW_TAGS" > .release-tags

          # Push tags (commits were already pushed in the "Version packages" step)
          git push --tags
          echo "✅ Pushed tags"

      - name: Create GitHub Releases (Canary)
        if: github.ref == 'refs/heads/canary' && steps.has-changesets.outputs.has_changesets == 'true'
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const owner = context.repo.owner
            const repo = context.repo.repo

            const tagsFile = path.join(process.env.GITHUB_WORKSPACE, '.release-tags')
            if (!fs.existsSync(tagsFile)) {
              core.info(`No tags file found at ${tagsFile}`)
              return
            }

            const tags = fs.readFileSync(tagsFile, 'utf8').trim().split(/\s+/).filter(Boolean)
            if (!tags.length) {
              core.info('Tags file is empty')
              return
            }

            const isPrerelease = context.ref === 'refs/heads/canary'
            core.info(`Creating GitHub releases for tags: ${tags.join(', ')} (prerelease=${isPrerelease})`)

            function parseTag(tag) {
              // Tag formats:
              // - @scope/package@version
              // - package@version
              const atIndex = tag.lastIndexOf('@')
              if (atIndex <= 0) return null
              const pkg = tag.slice(0, atIndex)
              const version = tag.slice(atIndex + 1)
              const pkgDir = pkg.startsWith('@') ? pkg.split('/').slice(1).join('/') : pkg
              return { pkg, version, pkgDir }
            }

            function extractChangelogSection(changelog, version) {
              // Mimics the old awk: get content after "## <version...>" until next "## "
              const lines = changelog.split(/\r?\n/)
              let found = false
              const out = []
              for (const line of lines) {
                if (line.startsWith('## ')) {
                  if (found) break
                  if (line.includes(version)) {
                    found = true
                    continue
                  }
                }
                if (found) out.push(line)
              }
              const body = out.join('\n').trim()
              return body.length ? body : null
            }

            for (const tag of tags) {
              core.info(`\nProcessing tag: ${tag}`)
              const parsed = parseTag(tag)
              if (!parsed) {
                core.warning(`Could not parse tag: ${tag}`)
                continue
              }

              // Skip if release exists
              try {
                await github.rest.repos.getReleaseByTag({ owner, repo, tag })
                core.info(`Release already exists for ${tag}, skipping`)
                continue
              } catch (e) {
                if (e.status !== 404) throw e
              }

              const changelogFile = path.join(process.env.GITHUB_WORKSPACE, 'libraries', 'typescript', 'packages', parsed.pkgDir, 'CHANGELOG.md')
              let notes = `Release ${parsed.version} of ${parsed.pkg}`

              if (fs.existsSync(changelogFile)) {
                const changelog = fs.readFileSync(changelogFile, 'utf8')
                const section = extractChangelogSection(changelog, parsed.version)
                if (section) {
                  notes = section
                } else {
                  core.info(`No changelog entry found for version ${parsed.version} in ${changelogFile}`)
                }
              } else {
                core.info(`No CHANGELOG.md found at ${changelogFile}`)
              }

              const name = `${parsed.pkg} ${parsed.version}`
              const make_latest = (!isPrerelease && parsed.pkg === 'mcp-use') ? 'true' : 'false'

              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name,
                body: notes,
                prerelease: isPrerelease,
                make_latest,
              })

              core.info(`Created release for ${tag}`)
            }

      - name: Create deployment marker (Canary)
        if: github.ref == 'refs/heads/canary' && steps.has-changesets.outputs.has_changesets == 'true'
        run: |
          echo "packages_published=true" > .railway-deploy-marker
          echo "branch=canary" >> .railway-deploy-marker

      - name: Upload deployment marker (Canary)
        if: github.ref == 'refs/heads/canary' && steps.has-changesets.outputs.has_changesets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: railway-deploy-marker
          path: .railway-deploy-marker
          retention-days: 1

      # ============================================================================
      # MAIN BRANCH: Stable release workflow
      # ============================================================================

      - name: Check if in prerelease mode (Main)
        if: github.ref == 'refs/heads/main'
        working-directory: libraries/typescript
        id: check-prerelease
        run: |
          if [ -f .changeset/pre.json ]; then
            echo "in_prerelease=true" >> $GITHUB_OUTPUT
            echo "🐤 Detected prerelease mode on main branch"
          else
            echo "in_prerelease=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Not in prerelease mode"
          fi

      - name: Create exit prerelease PR (Main)
        if: github.ref == 'refs/heads/main' && steps.check-prerelease.outputs.in_prerelease == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create new branch (from repo root)
          BRANCH_NAME="release/exit-prerelease-$(date +%s)"
          git checkout -b "$BRANCH_NAME"

          # Exit prerelease mode
          cd libraries/typescript
          echo "Exiting prerelease mode..."
          pnpm changeset pre exit

          # Version packages
          echo "Versioning packages..."
          pnpm changeset version

          # Go back to repo root for git operations
          cd ../..

          # Commit changes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(release): exit prerelease mode and version packages"

          # Push branch
          git push origin "$BRANCH_NAME"

          # Create PR
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "release(typescript): Exit prerelease mode and version packages" \
            --body "This PR exits prerelease mode and versions packages for stable release.

          ## Changes:

          - ✅ Exited prerelease mode (removed \`pre.json\`)
          - ✅ Versioned packages to stable versions
          - ✅ Updated CHANGELOGs

          ## After merging:

          - ✅ Packages will be automatically published to npm with \`latest\` tag
          - ✅ Git tags will be pushed
          - ✅ GitHub release will be created

          ---

          **This PR was automatically created after merging canary to main.**"

          echo "✅ Created exit prerelease PR"

      - name: Check if this is a release commit (Main)
        if: github.ref == 'refs/heads/main' && steps.check-prerelease.outputs.in_prerelease == 'false'
        id: check-release
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)

          if echo "$COMMIT_MSG" | grep -q "chore(release): exit prerelease mode" || [ "${{ github.event.inputs.force_publish }}" = "true" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "🚀 Detected release commit - will publish packages"
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Not a release commit - skipping publish"
          fi

      - name: Publish packages (Main)
        if: github.ref == 'refs/heads/main' &&
            steps.check-prerelease.outputs.in_prerelease == 'false' &&
            steps.check-release.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e  # Exit immediately if any command fails

          # Configure git identity - changesets creates annotated tags (git tag -m),
          # which fail without user.name/user.email configured
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Ensure we're on the latest commit and have all remote refs
          git fetch --tags --force
          git checkout main
          git pull origin main
          
          # Publish to npm using trusted publishing (OIDC) - no token needed
          cd libraries/typescript
          pnpm changeset publish
          pnpm changeset tag

          # Capture new tags created by changeset before pushing
          cd ../..
          NEW_TAGS=$(git tag --points-at HEAD)
          
          if [ -z "$NEW_TAGS" ]; then
            echo "❌ No tags were created by changeset tag - packages were published to npm but tagging failed"
            exit 1
          fi
          
          echo "📦 Tags created: $NEW_TAGS"

          # Save tags to a file for the next step
          echo "$NEW_TAGS" > .release-tags

          # Push git tags - fail immediately if this doesn't work
          # Note: Commits should already be pushed from the prerelease exit step
          if ! git push --tags; then
            echo "❌ Failed to push tags to remote (git push --tags)"
            rm -f .release-tags  # Clean up tags file since push failed
            exit 1
          fi

          echo "✅ Published packages to npm using trusted publishing and pushed tags"

      - name: Create deployment marker (Main)
        if: github.ref == 'refs/heads/main' &&
            steps.check-prerelease.outputs.in_prerelease == 'false' &&
            steps.check-release.outputs.should_publish == 'true'
        run: |
          echo "packages_published=true" > .railway-deploy-marker
          echo "branch=main" >> .railway-deploy-marker

      - name: Upload deployment marker (Main)
        if: github.ref == 'refs/heads/main' &&
            steps.check-prerelease.outputs.in_prerelease == 'false' &&
            steps.check-release.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: railway-deploy-marker
          path: .railway-deploy-marker
          retention-days: 1

      - name: Reset canary to main
        if: github.ref == 'refs/heads/main' && steps.check-prerelease.outputs.in_prerelease == 'false' && steps.check-release.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fetch latest changes
          git fetch origin

          # Checkout canary and reset to main (clean slate with stable versions)
          git checkout canary
          git reset --hard origin/main

          # Force push canary (since we did a reset)
          git push --force origin canary

          echo "✅ Reset canary to main (canary workflow will auto-enter prerelease mode)"

      - name: Create GitHub Release (Main)
        if: github.ref == 'refs/heads/main' && steps.check-prerelease.outputs.in_prerelease == 'false' && steps.check-release.outputs.should_publish == 'true'
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const owner = context.repo.owner
            const repo = context.repo.repo

            const tagsFile = path.join(process.env.GITHUB_WORKSPACE, '.release-tags')
            if (!fs.existsSync(tagsFile)) {
              core.info(`No tags file found at ${tagsFile}`)
              return
            }

            const tags = fs.readFileSync(tagsFile, 'utf8').trim().split(/\s+/).filter(Boolean)
            if (!tags.length) {
              core.info('Tags file is empty')
              return
            }

            const isPrerelease = false
            core.info(`Creating GitHub releases for tags: ${tags.join(', ')}`)

            function parseTag(tag) {
              const atIndex = tag.lastIndexOf('@')
              if (atIndex <= 0) return null
              const pkg = tag.slice(0, atIndex)
              const version = tag.slice(atIndex + 1)
              const pkgDir = pkg.startsWith('@') ? pkg.split('/').slice(1).join('/') : pkg
              return { pkg, version, pkgDir }
            }

            function extractChangelogSection(changelog, version) {
              const lines = changelog.split(/\r?\n/)
              let found = false
              const out = []
              for (const line of lines) {
                if (line.startsWith('## ')) {
                  if (found) break
                  if (line.includes(version)) {
                    found = true
                    continue
                  }
                }
                if (found) out.push(line)
              }
              const body = out.join('\n').trim()
              return body.length ? body : null
            }

            for (const tag of tags) {
              core.info(`\nProcessing tag: ${tag}`)
              const parsed = parseTag(tag)
              if (!parsed) {
                core.warning(`Could not parse tag: ${tag}`)
                continue
              }

              try {
                await github.rest.repos.getReleaseByTag({ owner, repo, tag })
                core.info(`Release already exists for ${tag}, skipping`)
                continue
              } catch (e) {
                if (e.status !== 404) throw e
              }

              const changelogFile = path.join(process.env.GITHUB_WORKSPACE, 'libraries', 'typescript', 'packages', parsed.pkgDir, 'CHANGELOG.md')
              let notes = `Release ${parsed.version} of ${parsed.pkg}`

              if (fs.existsSync(changelogFile)) {
                const changelog = fs.readFileSync(changelogFile, 'utf8')
                const section = extractChangelogSection(changelog, parsed.version)
                if (section) {
                  notes = section
                } else {
                  core.info(`No changelog entry found for version ${parsed.version} in ${changelogFile}`)
                }
              } else {
                core.info(`No CHANGELOG.md found at ${changelogFile}`)
              }

              const name = `${parsed.pkg} ${parsed.version}`
              const make_latest = (parsed.pkg === 'mcp-use') ? 'true' : 'false'

              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name,
                body: notes,
                prerelease: isPrerelease,
                make_latest,
              })

              core.info(`Created release for ${tag}`)
            }

      - name: Send Discord notification (Main)
        if: github.ref == 'refs/heads/main' && steps.check-prerelease.outputs.in_prerelease == 'false' && steps.check-release.outputs.should_publish == 'true'
        run: |
          # Read tags and find the main mcp-use package release
          if [ ! -f .release-tags ]; then
            echo "No release tags found, skipping Discord notification"
            exit 0
          fi

          # Find the main mcp-use package tag (not scoped @mcp-use/* packages)
          MAIN_TAG=$(grep -E '^mcp-use@' .release-tags | head -1)
          if [ -z "$MAIN_TAG" ]; then
            echo "No main mcp-use package tag found, skipping"
            exit 0
          fi

          VERSION="${MAIN_TAG#mcp-use@}"
          RELEASE_URL="https://github.com/mcp-use/mcp-use/releases/tag/${MAIN_TAG}"
          RELEASE_BODY=$(gh release view "$MAIN_TAG" --json body -q '.body' | head -c 1800)

          PAYLOAD=$(jq -n \
            --arg title "TypeScript v${VERSION}" \
            --arg url "$RELEASE_URL" \
            --arg desc "$RELEASE_BODY" \
            '{embeds: [{title: $title, url: $url, description: $desc, color: 5814783}]}')

          curl -s -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL"

          echo "✅ Sent Discord notification for mcp-use@${VERSION}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_CHANNEL_WEBHOOK_URL }}

  release-beta:
    name: Release beta
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: "pnpm"
          cache-dependency-path: libraries/typescript/pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"

      - name: Update npm for trusted publishing
        run: npm install --global npm@12.0.1

      - name: Verify beta prerelease state
        working-directory: libraries/typescript
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const pre = JSON.parse(fs.readFileSync('.changeset/pre.json', 'utf8'))
          if (pre.mode !== 'pre' || pre.tag !== 'beta') {
            throw new Error(`Expected beta prerelease mode; received ${JSON.stringify(pre)}`)
          }
          NODE

      - name: Verify bootstrap credential before changing versions
        working-directory: libraries/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is required for @mcp-use/client and @mcp-use/agent" >&2
            exit 1
          fi
          npm whoami
          npm org ls mcp-use --json >/dev/null

      - name: Install dependencies
        working-directory: libraries/typescript
        run: pnpm install --frozen-lockfile

      - name: Build packages
        working-directory: libraries/typescript
        run: pnpm build

      - name: Run beta release tests
        working-directory: libraries/typescript
        run: pnpm test:beta-release

      - name: Find pending beta changesets
        id: changesets
        working-directory: libraries/typescript
        run: |
          PENDING="$(node - <<'NODE'
          const fs = require('fs')
          const files = fs.readdirSync('.changeset')
            .filter((file) => file.endsWith('.md') && file !== 'README.md')
            .map((file) => file.slice(0, -3))
          const applied = new Set(JSON.parse(fs.readFileSync('.changeset/pre.json', 'utf8')).changesets)
          process.stdout.write(files.filter((id) => !applied.has(id)).join('\n'))
          NODE
          )"
          if [ -n "$PENDING" ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "$PENDING"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version beta packages
        if: steps.changesets.outputs.pending == 'true'
        working-directory: libraries/typescript
        run: pnpm version:beta

      - name: Commit beta versions
        if: steps.changesets.outputs.pending == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libraries/typescript
          git commit -m "chore(typescript): version beta packages"
          git push origin HEAD:beta

      - name: Validate release plan against npm
        working-directory: libraries/typescript
        run: pnpm verify:beta-plan --output beta-release-plan.json

      - name: Verify package tarballs
        working-directory: libraries/typescript
        run: pnpm verify:beta-packs

      - name: Check whether publication is needed
        id: publication
        working-directory: libraries/typescript
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const plan = JSON.parse(fs.readFileSync('beta-release-plan.json', 'utf8'))
          const unpublished = plan.releases.filter((release) => !release.published)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `needed=${unpublished.length > 0}\n`)
          console.log(unpublished)
          NODE

      - name: Publish token-authenticated scoped packages
        if: steps.publication.outputs.needed == 'true'
        working-directory: libraries/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node - <<'NODE' > /tmp/bootstrap-packages
          const fs = require('fs')
          const plan = JSON.parse(fs.readFileSync('beta-release-plan.json', 'utf8'))
          for (const release of plan.releases) {
            if (!release.published && release.requiresToken) console.log(release.name)
          }
          NODE
          while IFS= read -r package; do
            [ -z "$package" ] && continue
            pnpm --filter "$package" publish --tag beta --access public --no-git-checks
          done < /tmp/bootstrap-packages

      - name: Wait for bootstrapped packages
        if: steps.publication.outputs.needed == 'true'
        working-directory: libraries/typescript
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const { execFileSync } = require('child_process')
          const plan = JSON.parse(fs.readFileSync('beta-release-plan.json', 'utf8'))
          for (const release of plan.releases.filter((item) => item.requiresToken && !item.published)) {
            let found = false
            for (let attempt = 0; attempt < 12; attempt += 1) {
              try {
                const version = execFileSync('npm', ['view', `${release.name}@${release.version}`, 'version'], { encoding: 'utf8' }).trim()
                if (version === release.version) {
                  found = true
                  break
                }
              } catch {}
              Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, 5000)
            }
            if (!found) throw new Error(`${release.name}@${release.version} did not become visible on npm`)
          }
          NODE

      - name: Publish remaining beta packages with trusted publishing
        if: steps.publication.outputs.needed == 'true'
        working-directory: libraries/typescript
        run: pnpm changeset publish --tag beta

      - name: Verify npm versions and dist-tags
        working-directory: libraries/typescript
        run: |
          pnpm verify:beta-plan --output beta-release-after.json
          node - <<'NODE'
          const fs = require('fs')
          const before = JSON.parse(fs.readFileSync('beta-release-plan.json', 'utf8'))
          const after = JSON.parse(fs.readFileSync('beta-release-after.json', 'utf8'))
          for (const release of after.releases) {
            const previous = before.releases.find((item) => item.name === release.name)
            if (!release.published) throw new Error(`${release.name}@${release.version} is missing from npm`)
            if (release.betaBefore !== release.version) throw new Error(`${release.name} beta tag is ${release.betaBefore}, expected ${release.version}`)
            if (release.latestBefore !== previous.latestBefore) throw new Error(`${release.name} latest tag changed`)
          }
          NODE

      - name: Create and push package tags
        working-directory: libraries/typescript
        run: |
          pnpm changeset tag
          git push origin --tags
