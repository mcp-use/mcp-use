name: Events conformance
permissions:
  contents: read

# Permanent Events gates (PLAN.md §17.3.3, D73, WP-38):
#   storage-conformance  McpUseStorage conformance on every adapter against real
#                        Redis, Redis Cluster, Postgres and the Upstash REST
#                        protocol (serverless-redis-http); D1/DO via miniflare
#   events-conformance   events-core catalog against examples/mcp-events in both
#                        profiles (sep-3415@1, openai@1)
#   official-suites      modelcontextprotocol/conformance #521 (server) and #541
#                        (client), pinned by SHA in
#                        scripts/sdk-matrix/official-suites.json, run under
#                        compatibility.mcpName "strict", dialect "sep-3415"
#   template-smoke       create-mcp-use-app -> first delivery in the Inspector,
#                        no accounts, no env vars, <= 5 min excluding download

on:
  pull_request:
    branches: [main, canary, feat/mcp-events]
    paths:
      - "libraries/typescript/packages/server/src/events/**"
      - "libraries/typescript/packages/server/src/storage/**"
      - "libraries/typescript/packages/client/src/events/**"
      - "libraries/typescript/packages/events-core/**"
      - "libraries/typescript/packages/inspector/**"
      - "libraries/typescript/packages/create-mcp-use-app/**"
      - "libraries/typescript/examples/mcp-events/**"
      - "libraries/typescript/scripts/sdk-matrix/**"
      - "libraries/typescript/e2e/live/**"
      - "libraries/typescript/pnpm-workspace.yaml"
      - ".github/workflows/events-conformance.yml"
  push:
    branches: [main, canary, feat/mcp-events]
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""
  workflow_dispatch:

concurrency:
  group: events-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_VERSION: 22.23.1
  PNPM_VERSION: 11.13.1

jobs:
  ci-tooling:
    name: events CI tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: libraries/typescript
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Detector, continuity driver and live recorder
        run: node --test scripts/sdk-matrix/native-events-detector.test.mjs e2e/live/record.test.mjs

  storage-conformance:
    name: storage conformance (all adapters)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis-cluster:
        # Three masters on 7000-7002 (IP 0.0.0.0 so the runner can reach them).
        image: grokzen/redis-cluster:7.0.10
        env:
          IP: 0.0.0.0
          INITIAL_PORT: "7000"
          MASTERS: "3"
          SLAVES_PER_MASTER: "0"
        ports: ["7000:7000", "7001:7001", "7002:7002"]
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mcpuse
          POSTGRES_PASSWORD: mcpuse
          POSTGRES_DB: mcpuse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mcpuse" --health-interval 5s
          --health-timeout 3s --health-retries 10
      upstash:
        # Upstash REST protocol over the redis service.
        image: hiett/serverless-redis-http:0.0.10
        env:
          SRH_MODE: env
          SRH_TOKEN: ci-upstash-token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports: ["8079:80"]
    env:
      MCP_USE_TEST_REDIS_URL: redis://localhost:6379
      MCP_USE_TEST_REDIS_CLUSTER_URL: redis://localhost:7000
      MCP_USE_TEST_POSTGRES_URL: postgres://mcpuse:mcpuse@localhost:5432/mcpuse
      MCP_USE_TEST_UPSTASH_URL: http://localhost:8079
      MCP_USE_TEST_UPSTASH_TOKEN: ci-upstash-token
      # Real Upstash only on same-repo runs (forks have no secrets).
      UPSTASH_TEST_REST_URL: ${{ secrets.UPSTASH_TEST_REST_URL }}
      UPSTASH_TEST_REST_TOKEN: ${{ secrets.UPSTASH_TEST_REST_TOKEN }}
    defaults:
      run:
        working-directory: libraries/typescript
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: libraries/typescript/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Storage conformance and storageBackend contract suite
        working-directory: libraries/typescript/packages/server
        run: |
          if [ -d tests/storage ]; then
            pnpm exec vitest run tests/storage
          else
            # TODO(events): remove once WP-02/WP-20 land tests/storage.
            echo "::warning::tests/storage not present yet"
          fi

  events-conformance:
    name: events conformance (sep-3415@1, openai@1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      MCP_USE_TEST_REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: libraries/typescript
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: libraries/typescript/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - name: events-core catalog against examples/mcp-events
        working-directory: libraries/typescript/packages/server
        run: |
          if [ -d tests/events/conformance ]; then
            pnpm exec vitest run tests/events/conformance
          else
            # TODO(events): remove once WP-05 lands tests/events/conformance.
            echo "::warning::tests/events/conformance not present yet"
          fi

  official-suites:
    name: official suites #521/#541 (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_REF: ${{ github.base_ref || github.ref_name }}
    defaults:
      run:
        working-directory: libraries/typescript
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Read pins
        id: pins
        run: |
          node -e '
            const p = require("./scripts/sdk-matrix/official-suites.json");
            const sha = (s) => (s && /^[0-9a-f]{40}$/.test(s) ? s : "");
            const out = [
              `repo=${p.repository}`,
              `server=${sha(p.suites.server.sha)}`,
              `client=${sha(p.suites.client.sha)}`,
            ].join("\n");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, out + "\n");
          '
      - name: Require pins on canary and main
        if: steps.pins.outputs.server == '' || steps.pins.outputs.client == ''
        run: |
          case "$BASE_REF" in
            main|canary)
              echo "::error::official-suites.json must pin both suites to a 40-char SHA before merging into $BASE_REF"
              exit 1 ;;
            *)
              # TODO(events): pin #521/#541 head SHAs.
              echo "::warning::official suites not pinned yet; skipping on $BASE_REF" ;;
          esac
      - name: Checkout official server suite (#521)
        if: steps.pins.outputs.server != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pins.outputs.repo }}
          ref: ${{ steps.pins.outputs.server }}
          path: .official/server
          persist-credentials: false
      - name: Checkout official client suite (#541)
        if: steps.pins.outputs.client != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pins.outputs.repo }}
          ref: ${{ steps.pins.outputs.client }}
          path: .official/client
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: steps.pins.outputs.server != '' && steps.pins.outputs.client != ''
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        if: steps.pins.outputs.server != '' && steps.pins.outputs.client != ''
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: libraries/typescript/pnpm-lock.yaml
      - name: Run official suites (strict, sep-3415, expected-failures/pinned.json)
        if: steps.pins.outputs.server != '' && steps.pins.outputs.client != ''
        env:
          MCP_USE_OFFICIAL_SERVER_SUITE: ${{ github.workspace }}/.official/server
          MCP_USE_OFFICIAL_CLIENT_SUITE: ${{ github.workspace }}/.official/client
          MCP_USE_SDK_LEG: pinned
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build
          cd packages/server
          pnpm exec vitest run tests/events/official

  template-smoke:
    name: template smoke (create -> first delivery)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: libraries/typescript
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: libraries/typescript/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - name: Create -> first delivery, no accounts, no env vars
        working-directory: libraries/typescript/packages/create-mcp-use-app
        # Excluding package download, the smoke must finish in 5 minutes.
        timeout-minutes: 8
        run: |
          if [ -f tests/events-template-smoke.test.ts ]; then
            env -u OPENAI_API_KEY -u ANTHROPIC_API_KEY pnpm exec vitest run tests/events-template-smoke.test.ts
          else
            # TODO(events): remove once WP-33/WP-36 land the template smoke test.
            echo "::warning::events template smoke test not present yet"
          fi
