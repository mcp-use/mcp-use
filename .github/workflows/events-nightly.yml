name: Events nightly
permissions:
  contents: read

# Nightly Events checks (PLAN.md §17.3.3, D83, WP-38): every SDK matrix leg
# with continuity, #3209 interop in both directions, the external graders
# (MCPJam profiles, Hookdeck `mcp-dev check`), the native-Events release
# detector and the template smoke. Runs on feat/mcp-events until the canary
# merge, then on main (scheduled runs use the default branch; the dispatch
# input selects the ref).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to test"
        required: false
        type: string
        default: feat/mcp-events

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - id: ref
        env:
          INPUT_REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # TODO(events): drop the feat/mcp-events default once it merges into canary/main.
          if [ -n "$INPUT_REF" ]; then
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          elif gh api "repos/$GH_REPO/branches/feat/mcp-events" >/dev/null 2>&1; then
            echo "ref=feat/mcp-events" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

  sdk-matrix:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        sdk: [pinned, latest, prerelease, main, pr-3209]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/events-sdk-matrix.yml
    with:
      sdk: ${{ matrix.sdk }}
      ref: ${{ needs.resolve.outputs.ref }}

  conformance:
    needs: resolve
    uses: ./.github/workflows/events-conformance.yml
    secrets: inherit
    with:
      ref: ${{ needs.resolve.outputs.ref }}

  native-events-detector:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
      - name: Detect native Events in released SDK versions
        id: detect
        working-directory: libraries/typescript
        run: |
          set +e
          node scripts/sdk-matrix/native-events-detector.mjs > "$RUNNER_TEMP/detector.json"
          code=$?
          cat "$RUNNER_TEMP/detector.json"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -le 1 ]
      - name: Open drift issue
        if: steps.detect.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="sdk-native-events: a released SDK exports ./ext/events"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          body=$(printf 'Detector output:\n\n```json\n%s\n```\n\nReview D75/D84 drift and run the pr-3209 interop suite against it.' "$(cat "$RUNNER_TEMP/detector.json")")
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
    needs: resolve

  graders:
    needs: resolve
    name: external graders (MCPJam, Hookdeck)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: libraries/typescript
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: libraries/typescript/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - name: MCPJam profiles and Hookdeck mcp-dev check against examples/mcp-events
        run: |
          if [ -f e2e/graders/run.mjs ]; then
            node e2e/graders/run.mjs --profiles draft@28ec35e,chatgpt@2026-11-05,beta --hookdeck
          else
            # TODO(events): grader runner (pinned MCPJam CLI 6.4.3 + Hookdeck
            # mcp-dev) lands with examples/mcp-events (WP-36).
            echo "::warning::grader runner not present yet"
          fi
