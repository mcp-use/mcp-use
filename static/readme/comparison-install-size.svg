<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Installed footprint for native MCP Apps frameworks</title>
  <desc id="desc">mcp-use v2 measured 74.4 mebibytes, xmcp 121.9, Skybridge 137.5, and the mcp-use v1 migration baseline 404.6. Lower is better.</desc>
  <defs>
    <linearGradient id="mesh-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4026ff"/>
      <stop offset=".52" stop-color="#6558ff"/>
      <stop offset="1" stop-color="#9f4eff"/>
    </linearGradient>
    <radialGradient id="mesh-lime" cx=".08" cy=".05" r=".75">
      <stop offset="0" stop-color="#b9f66a"/>
      <stop offset=".42" stop-color="#b9f66a" stop-opacity=".72"/>
      <stop offset="1" stop-color="#b9f66a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh-pink" cx=".92" cy=".16" r=".72">
      <stop offset="0" stop-color="#f061ff"/>
      <stop offset=".5" stop-color="#f061ff" stop-opacity=".65"/>
      <stop offset="1" stop-color="#f061ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh-blue" cx=".18" cy=".78" r=".72">
      <stop offset="0" stop-color="#55d8ff"/>
      <stop offset=".5" stop-color="#55d8ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#55d8ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="highlight-bar">
      <rect x="170" y="507" width="160" height="73" rx="14"/>
    </clipPath>
    <style>
      .title { font: 750 34px Inter, ui-sans-serif, system-ui, sans-serif; fill: #17161c; letter-spacing: -.7px; }
      .subtitle { font: 400 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6d6878; }
      .direction { font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #5847e8; }
      .value { font: 700 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #302d37; }
      .label { font: 600 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6d6878; }
      .label-strong { font: 750 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #17161c; }
      .note { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6d6878; }
    </style>
  </defs>

  <rect width="1200" height="700" rx="28" fill="#faf9fc"/>
  <text x="60" y="66" class="title">Installed footprint for native MCP Apps frameworks</text>
  <text x="60" y="102" class="subtitle">Clean npm production install on the same machine · MiB on disk</text>
  <rect x="960" y="46" width="180" height="42" rx="21" fill="#ece9ff"/>
  <text x="1050" y="73" text-anchor="middle" class="direction">↓ Lower is better</text>

  <g stroke="#e7e3eb" stroke-width="1">
    <line x1="80" y1="220" x2="1120" y2="220"/>
    <line x1="80" y1="310" x2="1120" y2="310"/>
    <line x1="80" y1="400" x2="1120" y2="400"/>
    <line x1="80" y1="490" x2="1120" y2="490"/>
    <line x1="80" y1="580" x2="1120" y2="580"/>
  </g>

  <g fill="#d4d1da">
    <rect x="420" y="462" width="160" height="118" rx="14"/>
    <rect x="670" y="447" width="160" height="133" rx="14"/>
    <rect x="920" y="220" width="160" height="360" rx="14"/>
  </g>

  <g clip-path="url(#highlight-bar)">
    <rect x="170" y="507" width="160" height="73" fill="url(#mesh-base)"/>
    <rect x="170" y="507" width="160" height="73" fill="url(#mesh-lime)"/>
    <rect x="170" y="507" width="160" height="73" fill="url(#mesh-pink)"/>
    <rect x="170" y="507" width="160" height="73" fill="url(#mesh-blue)"/>
  </g>

  <g text-anchor="middle" class="value">
    <text x="250" y="493">74.4 MiB</text>
    <text x="500" y="448">121.9 MiB</text>
    <text x="750" y="433">137.5 MiB</text>
    <text x="1000" y="206">404.6 MiB</text>
  </g>

  <g text-anchor="middle">
    <text x="250" y="618" class="label-strong"><tspan x="250">mcp-use v2</tspan><tspan x="250" dy="21">native Apps</tspan></text>
    <text x="500" y="618" class="label"><tspan x="500">xmcp</tspan><tspan x="500" dy="21">native Apps</tspan></text>
    <text x="750" y="618" class="label"><tspan x="750">Skybridge</tspan><tspan x="750" dy="21">native Apps</tspan></text>
    <text x="1000" y="618" class="label"><tspan x="1000">mcp-use v1</tspan><tspan x="1000" dy="21">migration baseline</tspan></text>
  </g>

  <text x="60" y="677" class="note">Direct dependency sets and exact versions are recorded in the comparison methodology. v1 is a migration baseline, not a native Apps peer.</text>
</svg>
